# Đồng bộ delta Supabase → Google Sheets mỗi ngày 02:00 VN (19:00 UTC)
# Secrets cần cấu hình trên GitHub repo:
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
#   GOOGLE_SHEETS_ID
#   GOOGLE_SERVICE_ACCOUNT_JSON  (toàn bộ nội dung file JSON service account)

name: Sync Google Sheets Daily

on:
  schedule:
    # 02:00 Asia/Ho_Chi_Minh = 19:00 UTC ngày trước
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm i googleapis --no-save

      - name: Write Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > secrets/google-service-account.json

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ./secrets/google-service-account.json
        run: node scripts/sync-to-google-sheets.mjs
